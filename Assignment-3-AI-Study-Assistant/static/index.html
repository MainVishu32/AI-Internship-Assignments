<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Study Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        .chat-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            min-height: 450px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 18px;
            padding: 14px;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .user {
            background: #e8f0fe;
            margin-left: 15%;
        }

        .assistant {
            background: #f1f3f4;
            margin-right: 15%;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            min-height: 60px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            color: #777;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>AI Study Assistant</h1>
            <p>Ask questions and get simple, structured explanations.</p>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="message assistant">
                Hello! 👋 Ask me anything about your studies.
            </div>

        </div>

        <div class="input-area">

            <textarea
                id="question"
                placeholder="Ask a question..."
            ></textarea>

            <button id="askButton" onclick="askQuestion()">
                Ask
            </button>

        </div>

        <div class="status" id="status"></div>

    </div>


    <script>

        async function askQuestion() {

            const questionInput =
                document.getElementById("question");

            const askButton =
                document.getElementById("askButton");

            const chatBox =
                document.getElementById("chatBox");

            const status =
                document.getElementById("status");

            const question =
                questionInput.value.trim();


            if (!question) {
                status.textContent =
                    "Please enter a question.";

                return;
            }


            // Display user's question
            const userMessage =
                document.createElement("div");

            userMessage.className =
                "message user";

            userMessage.textContent =
                question;

            chatBox.appendChild(userMessage);


            questionInput.value = "";

            askButton.disabled = true;

            status.textContent =
                "AI is thinking...";


            try {

                const response =
                    await fetch("/api/ask", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            question: question
                        })

                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Something went wrong."
                    );

                }


                // Display AI response
                const assistantMessage =
                    document.createElement("div");

                assistantMessage.className =
                    "message assistant";

                assistantMessage.textContent =
                    data.answer;

                chatBox.appendChild(
                    assistantMessage
                );


            } catch (error) {

                const errorMessage =
                    document.createElement("div");

                errorMessage.className =
                    "message assistant";

                errorMessage.textContent =
                    "Error: " + error.message;

                chatBox.appendChild(
                    errorMessage
                );

            } finally {

                askButton.disabled = false;

                status.textContent = "";

                chatBox.scrollTop =
                    chatBox.scrollHeight;
            }
        }


        // Allow Ctrl + Enter to submit
        document
            .getElementById("question")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter" &&
                        event.ctrlKey
                    ) {
                        askQuestion();
                    }

                }
            );

    </script>

</body>
</html>
